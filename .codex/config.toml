# Codex project-local configuration (lean captain stack)
# Keep automation safe-by-default and writer scope narrow.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
model = "gpt-5"

[sandbox_workspace_write]
network_access = false

[features]
multitool = true

[agents]
max_threads = 3
max_depth = 1

[agents.explorer]
description = "Read-only code explorer for evidence collection before implementation."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "PR reviewer focused on correctness, security, and missing tests."
config_file = "agents/reviewer.toml"

[agents.feature_worker]
description = "Implements one approved feature slice end-to-end."
config_file = "agents/feature-worker.toml"

[profiles.readonly]
approval_policy = "on-request"
sandbox_mode = "read-only"

[profiles.safe_write]
approval_policy = "on-request"
sandbox_mode = "workspace-write"
