name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  codex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Run Codex review
        uses: openai/codex-action@v1
        with:
          prompt_file: .github/prompts/codex-pr-review.md
